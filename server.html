<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi Juego</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #2b2b2b, #0f0f0f);
      overflow: hidden;
      color: white;
    }

    /* MENU */
    .menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      transition: transform 1.2s cubic-bezier(.19,1,.22,1), opacity 1s;
      z-index: 2;
    }

    .menu.hide {
      transform: scale(1.4) rotateX(35deg);
      opacity: 0;
      pointer-events: none;
    }

    /* LOGO */
    .logo {
      width: 280px;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,.8));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* BOTÓN MINECRAFT */
    .play-btn {
      padding: 18px 70px;
      font-size: 28px;
      font-weight: bold;
      color: #3b2f1a;
      background: linear-gradient(#7ec850, #5fa53a);
      border: 4px solid #3a5f2a;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 8px 0 #2f4f1f, 0 20px 40px rgba(0,0,0,.6);
      transition: transform .1s, box-shadow .1s;
    }

    .play-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #2f4f1f, 0 10px 20px rgba(0,0,0,.6);
    }

    /* IFRAME */
    .game-container {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 1.2s ease, transform 1.2s ease;
      z-index: 1;
    }

    .game-container.show {
      opacity: 1;
      transform: scale(1);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: black;
    }

    /* EFECTO FLASH */
    .flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }

    .flash.active {
      animation: flash 0.6s ease;
    }

    @keyframes flash {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
  

    /* PORTAL */
    .portal {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
    }

    .portal.active {
      animation: portalFade 1.2s ease forwards;
    }

    .portal::before {
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 50%;
      box-shadow:
        0 0 30px 10px #7ec850,
        0 0 80px 40px rgba(126,200,80,.6),
        0 0 160px 80px rgba(126,200,80,.3);
      animation: portalGrow 1.2s ease forwards;
    }

    @keyframes portalGrow {
      to { transform: scale(80); }
    }

    @keyframes portalFade {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- MENU -->
  <div class="menu" id="menu">
    <!-- CAMBIA logo.png POR TU IMAGEN -->
    <img src="images/lospanas_logo.png" alt="Logo" class="logo" />
    <button class="play-btn" onclick="startGame()">JUGAR</button>
  </div>

  <!-- IFRAME -->
  <div class="game-container" id="game">
    <!-- CAMBIA LA URL DEL JUEGO -->
    <iframe src="eagler.html"></iframe>
  </div>

  <div class="flash" id="flash"></div>
  <div class="portal" id="portal"></div>

  <script>
    // === CONFIGURACIÓN DEL SERVIDOR ===
    // Cambia a true cuando el servidor esté encendido
    const serverOnline = false;

    function startGame() {
      if (!serverOnline) {
        alert('⛏️ Generando terreno… El servidor aún no está listo. Ve creando equipos y preparando la estrategia 👥🔥');
        // Expulsar de la web
        
        return;
      }

      document.getElementById('menu').classList.add('hide');
      document.getElementById('game').classList.add('show');

      const flash = document.getElementById('flash');
      const portal = document.getElementById('portal');

      flash.classList.add('active');
      portal.classList.add('active');

      setTimeout(() => {
        flash.classList.remove('active');
        portal.classList.remove('active');
      }, 1200);
    }
  </script>

</body>
</html>
